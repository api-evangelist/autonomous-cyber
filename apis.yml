name: Autonomous Cyber
description: Autonomous Cyber is the maker of FUZZ-E, an AI-powered platform for offensive
  cybersecurity marketed as "The AI Platform for Hacking." It equips commercial and
  government red teams with deep reconnaissance to uncover hard-to-find bugs and compromise
  networks, adaptive tooling that responds to AI-enabled defenses by building custom
  capabilities per engagement, and integrated intelligence workflows that consolidate
  data and toolkits inside the platform. The company states it operates strictly in
  the American national interest. Surfaced as a portfolio company of Bloomberg Beta;
  no public developer API is currently documented.
